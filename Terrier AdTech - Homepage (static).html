document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ly: var(--sans); color: var(--ink); }\n\n.site-nav {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 24px 64px;\n  position: sticky; top: 0; z-index: 50;\n  background: rgba(255,255,255,0.92);\n  backdrop-filter: blur(10px);\n  -webkit-backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--line-soft);\n}\n.site-nav .nav-c {\n  display: flex; gap: 36px;\n  font-family: var(--mono);\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: 0.12em;\n  color: var(--ink-2);\n}\n.site-nav .nav-c a {\n  position: relative;\n  padding: 4px 0;\n  transition: color .15s;\n}\n.site-nav .nav-c a:hover { color: var(--terra); }\n.site-nav .nav-c a.is-active { color: var(--terra); }\n.site-nav .nav-c a.is-active::after {\n  content: ''; position: absolute; left: 0; right: 0; bottom: -2px;\n  height: 1px; background: var(--terra);\n}\n\n.site-footer {\n  padding: 56px 64px;\n  background: var(--ink);\n  color: var(--paper);\n}\n.site-footer .footer-grid {\n  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; align-items: start;\n}\n.site-footer h4 {\n  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;\n  text-transform: uppercase; color: rgba(250,247,241,.5);\n  margin: 0 0 14px; font-weight: 500;\n}\n.site-footer a, .site-footer p {\n  display: block; font-size: 14px; color: rgba(250,247,241,.85);\n  margin-bottom: 8px; transition: color .15s;\n}\n.site-footer a:hover { color: var(--terra); }\n.site-footer .colophon {\n  margin-top: 64px; padding-top: 24px;\n  border-top: 1px solid rgba(250,247,241,.1);\n  display: flex; justify-content: space-between;\n  font-family: var(--mono); font-size: 11px;\n  color: rgba(250,247,241,.5); letter-spacing: 0.06em;\n}\n\n@media (max-width: 900px) {\n  .site-nav { padding: 16px 24px; }\n  .site-nav .nav-c { display: none; }\n  .site-footer { padding: 40px 24px; }\n  .site-footer .footer-grid { grid-template-columns: 1fr 1fr; }\n  .site-footer .colophon { flex-direction: column; gap: 8px; }\n}\n<\u002Fstyle>\n  <style>/* Home page — Editorial direction. */\n.home { font-size: 16px; line-height: 1.55; }\n\n/* Hero — masthead */\n.home .hero {\n  padding: 72px 64px 80px;\n  display: grid;\n  grid-template-columns: 1fr 320px;\n  gap: 64px;\n  align-items: end;\n  border-bottom: 1px solid var(--ink);\n}\n.home .hero h1 {\n  font-family: var(--serif);\n  font-weight: 400;\n  font-size: 132px;\n  line-height: 0.92;\n  letter-spacing: -0.04em;\n}\n.home .hero h1 .ital { font-style: italic; color: var(--terra); }\n.home .hero-side { font-size: 15px; color: var(--ink-2); line-height: 1.55; }\n.home .hero-side .meta {\n  font-family: var(--mono); font-size: 10px; text-transform: uppercase;\n  letter-spacing: 0.14em; color: var(--muted); margin-bottom: 14px;\n}\n.home .hero-side .lede {\n  font-family: var(--serif); font-size: 19px; line-height: 1.45; color: var(--ink);\n}\n\n/* Marquee strip */\n.home .strip {\n  padding: 18px 64px;\n  font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;\n  color: var(--ink); display: flex; gap: 64px; align-items: center;\n  border-bottom: 1px solid var(--ink); background: var(--cream);\n  flex-wrap: wrap;\n}\n.home .strip .dot {\n  width: 5px; height: 5px; border-radius: 50%;\n  background: var(--terra); flex-shrink: 0;\n}\n.home .strip .pill {\n  font-family: var(--serif); font-size: 18px;\n  text-transform: none; letter-spacing: 0;\n}\n\n/* Photo band — full-bleed editorial image */\n.home .photo-band {\n  position: relative; margin: 0;\n  border-bottom: 1px solid var(--ink);\n  background: var(--cream-2);\n}\n.home .photo-band img {\n  display: block; width: 100%; height: 52vh; min-height: 320px; max-height: 560px;\n  object-fit: cover; object-position: center 38%;\n}\n.home .photo-band figcaption {\n  position: absolute; bottom: 16px; left: 64px;\n  font-family: var(--mono); font-size: 10px;\n  letter-spacing: 0.12em; text-transform: uppercase;\n  color ight: 0.78; padding: 8px 12px 0 0; font-weight: 400;\n}\n\n/* Manifesto aside figure */\n.home .aside-figure { margin: 28px 0 0; }\n.home .aside-figure img {\n  display: block; width: 100%; aspect-ratio: 3 / 4;\n  object-fit: cover; border-radius: 2px;\n}\n.home .aside-figure figcaption {\n  margin-top: 10px;\n  font-family: var(--mono); font-size: 10px;\n  letter-spacing: 0.12em; text-transform: uppercase;\n  color: var(--muted);\n}\n\n/* Services strip */\n.home .services {\n  border-top: 1px solid var(--ink);\n  border-bottom: 1px solid var(--ink);\n  background: var(--ink);\n  color: var(--paper);\n}\n.home .services-head {\n  padding: 64px 64px 40px;\n  display: grid; grid-template-columns: 1fr 1fr; gap: 64px;\n}\n.home .services-head .eyebrow { color: rgba(250,247,241,.5); }\n.home .services-head h2 {\n  font-family: var(--serif); font-size: 44px; font-weight: 400; line-height: 1.1;\n}\n.home .services-head p {\n  font-size: 15px; color: rgba(250,247,241,.7); max-width: 420px;\n}\n.home .service-row {\n  padding: 36px 64px;\n  display: grid; grid-template-columns: 80px 280px 1fr 80px; gap: 32px;\n  align-items: baseline;\n  border-top: 1px solid rgba(250,247,241,.14);\n  transition: background .2s;\n  cursor: pointer;\n  text-decoration: none;\n  color: inherit;\n}\n.home .service-row:hover { background: rgba(250,247,241,.04); }\n.home .service-row:hover .arrow { color: var(--terra); transform: translateX(4px); }\n.home .service-row .num {\n  font-family: var(--mono); font-size: 12px; color: rgba(250,247,241,.5);\n}\n.home .service-row .title {\n  font-family: var(--serif); font-size: 36px; font-weight: 400; letter-spacing: -0.02em;\n}\n.home .service-row .desc {\n  font-size: 14px; color: rgba(250,247,241,.7); line-height: 1.6;\n}\n.home .service-row .arrow {\n  font-size: 22px; text-align: right;\n  transition: color .2s, transform .2s; color: rgba(250,247,241,.5);\n}\n\n/* Process */\n.home .process { padding: 120px 64px; }\n.home .process-head {\n  display: flex; justify-content: space-between; align-items: end;\n  margin-bottom: 64px;\n}\n.home .process-head h2 {\n  font-family: var(--serif); font-size: 56px; font-weight: 400;\n  max-width: 680px; line-height: 1.05;\n}\n.home .process-grid {\n  display: grid; grid-template-columns: repeat(3, 1fr);\n  gap: 0; border-top: 1px solid var(--line);\n}\n.home .pcard { padding: 36px 32px 36px 0; border-right: 1px solid var(--line); }\n.home .pcard:last-child { border-right: 0; }\n.home .pcard .step {\n  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;\n  text-transform: uppercase; color: var(--terra);\n}\n.home .pcard h3 {\n  font-family: var(--serif); font-size: 28px; font-weight: 400;\n  margin-top: 18px; line-height: 1.15;\n}\n.home .pcard p {\n  margin-top: 16px; font-size: 14px; color: var(--muted); line-height: 1.6;\n}\n.home .pcard .duration {\n  margin-top: 24px; font-family: var(--mono); font-size: 11px; color: var(--muted);\n}\n.home .pcard:nth-child(2) { padding-left: 32px; }\n.home .pcard:nth-child(3) { padding-left: 32px; }\n\n/* Writing */\n.home .writing { padding: 120px 64px; border-top: 1px solid var(--line-soft); }\n.home .writing-head {\n  display: flex; justify-content: space-between; align-items: end;\n  margin-bottom: 56px; gap: 48px;\n}\n.home .writing-head h2 {\n  font-family: var(--serif); font-size: 56px; font-weight: 400;\n  line-height: 1.05; letter-spacing: -0.025em; max-width: 680px;\n}\n.home .writing-head .all {\n  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;\n  text-transform: uppercase; color: var(--terra); white-space: nowrap;\n}\n.home .writing-list { border-top: 1px solid var(--ink); }\n.home .article {\n  display: grid; grid-template-columns: 80px 1fr 200px 120px 60px;\n  gap: 32px; align-items: baseline;\n  padding: 28px 0; border-bottom: 1px solid var(--line);\n  transition: padding .15s; cursor: pointer;\n  text-decoration: none; color: inherit;\n}\n.home .article:hover { padding-left: 12px; }\ ng engagement.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"clients-grid\">\n        <div class=\"logo-cell\"><img src=\"ec3cfaa2-b368-4d05-9586-c11b633c4056\" alt=\"Just Eat Takeaway\"><\u002Fdiv>\n        <div class=\"logo-cell\"><img src=\"f11fa3ab-851c-400c-b9e3-2aff39eb3a69\" alt=\"eMAG\"><\u002Fdiv>\n        <div class=\"logo-cell\"><img src=\"6e22b1fc-6477-490e-b44e-453d63949760\" alt=\"Allegro\"><\u002Fdiv>\n        <div class=\"logo-cell\"><img src=\"f02f6772-a809-4c00-85f4-6c243ee42a83\" alt=\"Mercado Libre\"><\u002Fdiv>\n        <div class=\"logo-cell\"><img src=\"a68a9a35-ce8a-4fd4-b1e4-1b689fd4b50b\" alt=\"Pacvue\"><\u002Fdiv>\n        <div class=\"logo-cell\"><img src=\"4c5761e8-f05c-4688-9135-4607179809b9\" alt=\"Topsort\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"manifesto\" id=\"approach\">\n      <div class=\"col\">\n        <div>\n          <div class=\"eyebrow\">A note from us<\u002Fdiv>\n          <figure class=\"aside-figure\">\n            <img src=\"07884a21-6ab1-4d17-a52c-aeb07b51a467\" alt=\"Four tall palm trees against a pale blue sky\">\n            <figcaption>Built for the long game.<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n        <div>\n          <h2>\n            <span class=\"drop\">A<\u002Fspan>dtech is a long game played in short deadlines. The teams that win compound — they pick the right bets, ship them well, and build platforms that keep paying out years later. That's the work we like, and that's the work we're built for.\n          <\u002Fh2>\n          <p style=\"margin-top: 32px; font-size: 17px; color: var(--muted); max-width: 720px;\">\n            We've spent careers inside Google, Amazon, Snap, and Microsoft, designing the systems behind some of the largest ad businesses in the world. Now we bring that craft to teams who'd rather hire one tenacious partner than fifteen confused vendors.\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"services\" id=\"services\">\n      <div class=\"services-head\">\n        <div>\n          <div class=\"eyebrow\">Services<\u002Fdiv>\n          <h2 style=\"margin-top: 12px;\">Four practices.<br>One end-to-end engagement.<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"align-self: end;\">\n          <p>From the first conversation through production rollout — we cover the full distance, or pair tightly with one piece of it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <a class=\"service-row\" href=\"services.html#strategy\">\n        <div class=\"num\">01<\u002Fdiv>\n        <div class=\"title\">Product Strategy<\u002Fdiv>\n        <div class=\"desc\">Roadmap design, monetization architecture, and platform vision tied to revenue outcomes you can measure.<\u002Fdiv>\n        <div class=\"arrow\">→<\u002Fdiv>\n      <\u002Fa>\n      <a class=\"service-row\" href=\"services.html#system\">\n        <div class=\"num\">02<\u002Fdiv>\n        <div class=\"title\">System Design<\u002Fdiv>\n        <div class=\"desc\">Ad serving, auction, targeting, measurement — designed to scale and survive the next three platform shifts.<\u002Fdiv>\n        <div class=\"arrow\">→<\u002Fdiv>\n      <\u002Fa>\n      <a class=\"service-row\" href=\"services.html#engineering\">\n        <div class=\"num\">03<\u002Fdiv>\n        <div class=\"title\">Engineering<\u002Fdiv>\n        <div class=\"desc\">Implementation partners. Prototype to production. We write code, ship features, and stay accountable.<\u002Fdiv>\n        <div class=\"arrow\">→<\u002Fdiv>\n      <\u002Fa>\n      <a class=\"service-row\" href=\"services.html#data\">\n        <div class=\"num\">04<\u002Fdiv>\n        <div class=\"title\">Data Science<\u002Fdiv>\n        <div class=\"desc\">Ranking, pacing, attribution, and rigorous experimentation — the part most teams underinvest in.<\u002Fdiv>\n        <div class=\"arrow\">→<\u002Fdiv>\n      <\u002Fa>\n    <\u002Fsection>\n\n    <section class=\"process\">\n      <div class=\"process-head\">\n        <div>\n          <div class=\"eyebrow\">How we work<\u002Fdiv>\n          <h2 style=\"margin-top: 14px;\">Three phases. Roughly twelve weeks. Then we get out of the way.<\u002Fh2>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"process-grid\">\n        <div class=\"pcard\">\n          <div class=\"step\">Phase 01 · Assess<\u002Fdiv>\n          <h3>Understand the system as it is.<\u002Fh3>\n          <p>We read your stack, your product, your org. We surface strengths to lean on and risks to retire — fast, in writing, with receipts.<\u002Fp>\n          <div class=\"duration\">~ 2 weeks<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pcard\">\n          <div class=\"step\">Phase 02 · Strategize<\u002Fdiv>\n          <h3>Frame measurable bets.<\u002Fh3>\n          <p>Together we build a strategy with clear objectives and a sequenced roadmap — short-term wins beside long-term platform plays.<\u002Fp>\n          <div class=\"duration\">~ 3 weeks<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pcard\">\n          <div class=\"step\">Phase 03 · Execute<\u002Fdiv>\n          <h3>Ship side-by-side.<\u002Fh3>\n          <p>Hands-on prioritization, sequencing, and building. Concrete guidance on monetization, campaign performance, and engagement.<\u002Fp>\n          <div class=\"duration\">~ 7+ weeks<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"writing\" id=\"writing\">\n      <div class=\"writing-head\">\n        <div>\n          <div class=\"eyebrow\">Writing<\u002Fdiv>\n          <h2 style=\"margin-top: 14px;\">Notes from inside the stack.<\u002Fh2>\n        <\u002Fdiv>\n        <a href=\"https://medium.com/@larshirsch\" target=\"_blank\" rel=\"noopener\" class=\"all\">All articles on Medium →<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"writing-list\">\n        <a class=\"article\" href=\"https://medium.com/@larshirsch\" t
